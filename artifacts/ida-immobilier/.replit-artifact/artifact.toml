kind = "web"
previewPath = "/"
title = "I.D.A Immobilier"
version = "1.0.0"
id = "artifacts/ida-immobilier"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23125

[services.development]
run = "pnpm --filter @workspace/ida-immobilier run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ida-immobilier", "run", "build" ]
publicDir = "artifacts/ida-immobilier/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23125"
BASE_PATH = "/"
